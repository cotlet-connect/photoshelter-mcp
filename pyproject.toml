[project]
name = "photoshelter-mcp"
version = "1.1.0"
description = "Connect PhotoShelter to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No PhotoShelter API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["photoshelter", "photoshelter api", "photoshelter mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/photoshelter-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=photoshelter"
Source = "https://github.com/cotlet-connect/photoshelter-mcp"

[project.scripts]
photoshelter-mcp = "photoshelter_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"photoshelter_agent.py" = "photoshelter_agent.py"

[tool.hatch.build.targets.sdist]
include = ["photoshelter_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
